name: Unit Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore test projects
        run: |
          dotnet restore UnitTests/TestFramework.Azure.Tests/TestFramework.Azure.Tests.csproj
          dotnet restore UnitTests/TestFramework.Azure.Functions.Tests/TestFramework.Azure.Functions.Tests.csproj

      - name: Run TestFramework.Azure unit tests
        run: dotnet test UnitTests/TestFramework.Azure.Tests/TestFramework.Azure.Tests.csproj --configuration Release --no-restore --logger "trx"

      - name: Run TestFramework.Azure.Functions unit tests
        run: dotnet test UnitTests/TestFramework.Azure.Functions.Tests/TestFramework.Azure.Functions.Tests.csproj --configuration Release --no-restore --logger "trx"